# SafeVision AI - Ultralytics Construction-PPE dataset configuration
# Source: https://docs.ultralytics.com/datasets/detect/construction-ppe
# The source dataset contains train (800) and validation (200) only; it has no official test split.
# Ultralytics downloads and extracts the archive automatically when training starts.
path: construction-ppe
train: images/train
val: images/val

names:
  0: helmet
  1: gloves
  2: vest
  3: boots
  4: goggles
  5: Person
  6: no_helmet
  7: no_goggle
  8: no_gloves
  9: no_boots
  10: forklift
  11: no_vest

download: https://github.com/ultralytics/assets/releases/download/v0.0.0/construction-ppe.zip
